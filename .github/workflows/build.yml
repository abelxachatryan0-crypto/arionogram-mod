name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Insert API keys
        env:
          AID: ${{ secrets.API_ID }}
          AHASH: ${{ secrets.API_HASH }}
        run: |
          set -e
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

          sed -i "s/APP_ID = [0-9]*;/APP_ID = $AID;/" "$F"
          sed -i "s/APP_HASH = \"[^\"]*\";/APP_HASH = \"$AHASH\";/" "$F"

      - name: Rebrand
        run: |
          set -e

          sed -i 's/^APP_PACKAGE *=.*/APP_PACKAGE=com.arionogram.app/' gradle.properties

          sed -i "s|^apply plugin: 'com.google.gms.google-services'|// &|" \
            TMessagesProj_App/build.gradle

          find TMessagesProj/src/main/res TMessagesProj_App/src \
            -type f -name '*.xml' -print0 2>/dev/null |
            xargs -0 -r sed -i \
              -e 's/Telegram Beta/Arionogram/g' \
              -e 's/>Telegram</>Arionogram</g'

      - name: Apply Arionogram mod changes
        run: |
          set -e
          chmod +x scripts/arionogram_mod.sh
          ./scripts/arionogram_mod.sh

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arionogram-apk
          path: "**/*.apk"
          if-no-files-found: error
