name: Build Arionogram

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Missing Submodules Directory
        run: |
          mkdir -p TMessagesProj_Modules/media
          if [ ! -f TMessagesProj_Modules/media/core_settings.gradle ]; then
            echo "// Auto-generated dummy core_settings" > TMessagesProj_Modules/media/core_settings.gradle
          fi

      - name: Run Arionogram Mod Script
        run: |
          chmod +x scripts/arionogram_mod.sh
          ./scripts/arionogram_mod.sh

      - name: Build Arionogram APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            -x processAfatDebugGoogleServices \
            -x processAfatReleaseGoogleServices \
            --no-daemon \
            --build-cache \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arionogram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          
